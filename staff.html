<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F2EC" id="themeColorMeta" />
<meta name="robots" content="noindex, nofollow" />
<title>Smashed Burger — Staff</title>
<link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png" />
<link rel="apple-touch-icon" href="image/staff-apple-touch-icon.png" />
<link rel="manifest" href="staff.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SB Staff" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  /* Same colour system as the menu */
  :root, html[data-theme="light"] {
    --c-base: 245 242 236; --c-surface: 255 255 255; --c-surface-alt: 237 233 225;
    --c-ink: 26 26 26; --c-muted: 107 107 107; --c-edge: 26 26 26;
    --c-accent: 196 69 58; --c-accent-hover: 168 55 46; --c-hot: 168 55 46;
    --shadow-card: rgba(26,26,26,.10);
    --c-ok: 22 163 74; --c-warn: 217 119 6;
  }
  html[data-theme="dark"] {
    --c-base: 24 24 27; --c-surface: 39 39 42; --c-surface-alt: 63 63 70;
    --c-ink: 255 255 255; --c-muted: 161 161 170; --c-edge: 255 255 255;
    --c-accent: 196 69 58; --c-accent-hover: 168 55 46; --c-hot: 220 90 80;
    --shadow-card: rgba(0,0,0,.7);
    --c-ok: 74 222 128; --c-warn: 251 191 36;
  }
  :root { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: none; }

  html[data-locale="ar"] { --rtl-font: 'Cairo', 'Noto Sans Arabic', system-ui, sans-serif; }
  html[data-locale="ku"] { --rtl-font: 'Noto Sans Arabic', 'Cairo', system-ui, sans-serif; }
  html[data-locale="ar"] body, html[data-locale="ku"] body,
  html[data-locale="ar"] input, html[data-locale="ku"] input,
  html[data-locale="ar"] button, html[data-locale="ku"] button,
  html[data-locale="ar"] .font-display, html[data-locale="ku"] .font-display { font-family: var(--rtl-font); }
  html[data-locale="ar"] *, html[data-locale="ku"] * { letter-spacing: 0 !important; }

  :focus-visible { outline: 2px solid rgb(var(--c-accent)); outline-offset: 2px; }
  .tnum { font-variant-numeric: tabular-nums; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  [dir="rtl"] .rtl-flip { transform: scaleX(-1); }
  .hidden-view { display: none !important; }

  .header-logo-light { display: block; } .header-logo-dark { display: none; }
  html[data-theme="dark"] .header-logo-light { display: none; }
  html[data-theme="dark"] .header-logo-dark { display: block; }
  html[data-theme="light"] .ambient-only-dark { display: none; }

  /* ── Animations ── */
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-14px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes newGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(196,69,58,.55), 0 10px 30px -12px rgba(196,69,58,.35); }
    50%      { box-shadow: 0 0 0 3px rgba(196,69,58,.85), 0 16px 44px -10px rgba(196,69,58,.6); }
  }
  @keyframes latePulse { 0%, 100% { background-color: rgba(196,69,58,.10); } 50% { background-color: rgba(196,69,58,.24); } }
  @keyframes badgeHop { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.35); } 70% { transform: scale(.92); } }
  @keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ringOut { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }

  .anim-rise { animation: riseIn .55s cubic-bezier(.22,1,.36,1) both; }
  .card-in { animation: cardIn .45s cubic-bezier(.22,1,.36,1) both; }
  .is-pending { animation: newGlow 1.8s ease-in-out infinite; }
  .is-late { animation: latePulse 1.6s ease-in-out infinite; }
  .badge-hop { animation: badgeHop .5s cubic-bezier(.22,1,.36,1); }
  .live-dot { position: relative; }
  .live-dot::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; background: currentColor; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
  .bell-wiggle { animation: wiggle .7s ease-in-out; }
  .sheet-panel { animation: sheetUp .34s cubic-bezier(.22,1,.36,1) both; }
  @media (min-width: 640px) { .sheet-panel { animation: riseIn .3s cubic-bezier(.22,1,.36,1) both; } }
  .fp-pulse { animation: fpPulse 1.4s ease-in-out infinite; }
  @keyframes fpPulse { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
  .backdrop-in { animation: fadeIn .2s ease-out both; }
  .sales-detail { animation: riseIn .4s cubic-bezier(.22,1,.36,1) both; }
  .ring-out { position: absolute; inset: 0; border-radius: 9999px; border: 2px solid rgb(var(--c-accent)); animation: ringOut 1.4s ease-out infinite; }

  /* Countdown ring */
  .cd-ring circle { transition: stroke-dashoffset 1s linear, stroke .3s ease; }

  /* Toggle switch */
  .switch { position: relative; width: 44px; height: 26px; border-radius: 9999px; background: rgb(var(--c-surface-alt)); transition: background-color .25s ease; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.22,1,.36,1); }
  .switch.is-on { background: rgb(var(--c-ok)); }
  .switch.is-on::after { transform: translateX(18px); }
  [dir="rtl"] .switch.is-on::after { transform: translateX(-18px); }

  /* Kitchen ticket printing: only the ticket is printed */
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; font-family: 'Inter', system-ui, sans-serif; color: #000; width: 72mm; margin: 0; padding: 0; }
    @page { size: 80mm auto; margin: 4mm; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
<link rel="stylesheet" href="tailwind.css?v=20261018e" />
</head>

<body class="min-h-screen bg-base font-sans text-ink antialiased selection:bg-brand/30">

<div class="ambient-only-dark pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
  <div class="absolute -top-40 -start-32 h-96 w-96 rounded-full bg-brand/10 blur-3xl"></div>
  <div class="absolute top-1/3 -end-32 h-96 w-96 rounded-full bg-brandDark/10 blur-3xl"></div>
</div>

<!-- ============================== LOGIN ============================== -->
<section id="loginView" class="hidden-view relative flex min-h-screen flex-col overflow-hidden">
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-32 start-1/2 h-[30rem] w-[30rem] -translate-x-1/2 rounded-full bg-brand/15 blur-3xl"></div>
    <div class="absolute -bottom-40 -end-20 h-96 w-96 rounded-full bg-brandDark/15 blur-3xl"></div>
  </div>

  <div class="relative z-10 flex items-center justify-end gap-2 px-5 pt-[max(1rem,env(safe-area-inset-top))]">
    <div data-lang-switcher class="relative"></div>
    <button data-theme-toggle type="button" class="grid h-10 w-10 place-items-center rounded-xl bg-surface ring-1 ring-edge/5 transition hover:ring-brand/40" aria-label="Toggle theme"></button>
  </div>

  <div class="relative z-10 flex flex-1 items-center justify-center px-5 py-10">
    <form id="loginForm" class="anim-rise w-full max-w-sm rounded-3xl bg-surface p-7 shadow-card ring-1 ring-edge/5" novalidate>
      <div class="flex justify-center">
        <img src="image/lightsidelogo.webp" alt="Smashed Burger" class="header-logo-light h-14 w-auto" />
        <img src="image/darksidelogo.webp" alt="Smashed Burger" class="header-logo-dark h-14 w-auto" />
      </div>
      <h1 class="mt-6 text-center font-display text-2xl" data-i18n="loginTitle">Staff sign in</h1>
      <p class="mt-1 text-center text-sm text-muted" data-i18n="loginSub">For admins and cashiers only.</p>

      <label class="mt-6 block text-xs font-bold uppercase tracking-wide text-muted" for="loginEmail" data-i18n="email">Email</label>
      <div class="relative mt-1.5">
        <i data-lucide="mail" class="pointer-events-none absolute start-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted"></i>
        <input id="loginEmail" type="email" autocomplete="username" required dir="ltr"
          class="w-full rounded-xl border-0 bg-surfaceAlt py-3 ps-10 pe-3 text-sm text-ink ring-1 ring-edge/5 transition placeholder:text-muted focus:ring-2 focus:ring-brand/60" />
      </div>

      <label class="mt-4 block text-xs font-bold uppercase tracking-wide text-muted" for="loginPassword" data-i18n="password">Password</label>
      <div class="relative mt-1.5">
        <i data-lucide="lock" class="pointer-events-none absolute start-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted"></i>
        <input id="loginPassword" type="password" autocomplete="current-password" required dir="ltr"
          class="w-full rounded-xl border-0 bg-surfaceAlt py-3 ps-10 pe-11 text-sm text-ink ring-1 ring-edge/5 transition focus:ring-2 focus:ring-brand/60" />
        <button type="button" id="togglePw" class="absolute end-2 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-lg text-muted transition hover:text-ink" aria-label="Show password">
          <i data-lucide="eye" class="h-4 w-4"></i>
        </button>
      </div>

      <p id="loginError" class="mt-3 hidden rounded-lg bg-brand/10 px-3 py-2 text-xs font-semibold text-brand"></p>

      <button id="loginBtn" type="submit"
        class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-brand to-brandDark px-4 py-3.5 text-sm font-bold text-white shadow-glow transition hover:from-brandDark hover:to-brandDeeper active:scale-[.98] disabled:opacity-60">
        <i data-lucide="log-in" class="h-4 w-4 rtl-flip"></i>
        <span data-i18n="signIn">Sign in</span>
      </button>
    </form>
  </div>
</section>

<!-- =========================== START SHIFT =========================== -->
<section id="shiftView" class="hidden-view fixed inset-0 z-[70] grid place-items-center bg-base/95 px-6 backdrop-blur-xl">
  <div class="anim-rise w-full max-w-sm text-center">
    <div class="relative mx-auto grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-brand to-brandDark text-white shadow-glow">
      <span class="ring-out"></span>
      <i data-lucide="bell-ring" class="h-10 w-10"></i>
    </div>
    <h2 class="mt-7 font-display text-3xl" data-i18n="shiftTitle">Ready for orders?</h2>
    <p class="mx-auto mt-2 max-w-xs text-sm text-muted" data-i18n="shiftSub">Tap to start your shift. This turns on the new-order sound and keeps the screen awake.</p>
    <button id="startShiftBtn" type="button"
      class="mt-8 w-full rounded-2xl bg-gradient-to-r from-brand to-brandDark px-6 py-4 text-base font-bold text-white shadow-glow transition hover:from-brandDark hover:to-brandDeeper active:scale-[.98]">
      <span data-i18n="startShift">Start shift</span>
    </button>
    <p id="shiftWho" class="mt-4 text-xs text-muted"></p>
  </div>
</section>

<!-- =============================== APP =============================== -->
<div id="appView" class="hidden-view">
  <header class="sticky top-0 z-40 border-b border-edge/5 bg-base/85 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-2 px-4 sm:gap-3">
      <img src="image/lightsidelogo.webp" alt="Smashed Burger" class="header-logo-light h-9 w-auto shrink-0 sm:h-10" />
      <img src="image/darksidelogo.webp" alt="Smashed Burger" class="header-logo-dark h-9 w-auto shrink-0 sm:h-10" />

      <span id="livePill" class="ms-1 hidden items-center gap-1.5 rounded-full bg-surface px-2.5 py-1 text-[11px] font-bold ring-1 ring-edge/5 sm:inline-flex">
        <span class="live-dot h-2 w-2 rounded-full bg-current"></span>
        <span id="liveLabel">Live</span>
      </span>

      <div class="ms-auto flex items-center gap-2">
        <div id="statChips" class="hidden items-center gap-2 lg:flex"></div>
        <button id="soundBtn" type="button" class="grid h-10 w-10 place-items-center rounded-xl bg-surface ring-1 ring-edge/5 transition hover:ring-brand/40" aria-label="Sound"></button>
        <div data-lang-switcher class="relative"></div>
        <button data-theme-toggle type="button" class="grid h-10 w-10 place-items-center rounded-xl bg-surface ring-1 ring-edge/5 transition hover:ring-brand/40" aria-label="Toggle theme"></button>
        <button id="menuBtn" type="button" class="grid h-10 w-10 place-items-center rounded-xl bg-surface ring-1 ring-edge/5 transition hover:ring-brand/40" aria-label="Menu">
          <i data-lucide="menu" class="h-5 w-5"></i>
        </button>
      </div>
    </div>

    <div id="offlineBar" class="hidden border-t border-brand/20 bg-brand/10 px-4 py-2 text-center text-xs font-bold text-brand">
      <span data-i18n="offline">Connection lost — reconnecting… New orders may be delayed.</span>
    </div>

    <!-- Tabs (phones / portrait); on wide screens the board shows all columns -->
    <nav id="tabs" class="no-scrollbar mx-auto flex max-w-7xl gap-1.5 overflow-x-auto px-4 pb-3 lg:hidden" role="tablist"></nav>
  </header>

  <main class="mx-auto max-w-7xl px-4 pb-24 pt-4">
    <div id="board" class="grid gap-4 lg:grid-cols-3"></div>

    <section id="doneSection" class="mt-8 hidden lg:block">
      <div class="mb-3 flex items-center gap-2">
        <h2 class="font-display text-lg" data-i18n="doneToday">Done today</h2>
        <span id="doneCount" class="tnum rounded-full bg-surfaceAlt px-2 py-0.5 text-[11px] font-bold text-muted">0</span>
      </div>
      <div id="doneList" class="grid gap-2 sm:grid-cols-2 xl:grid-cols-3"></div>
    </section>
  </main>
</div>

<!-- ============================ SHEET / MODAL ============================ -->
<div id="sheetRoot" class="fixed inset-0 z-[60] hidden">
  <div id="sheetBackdrop" class="backdrop-in absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="absolute inset-0 flex items-end justify-center sm:items-center sm:p-4">
    <div id="sheetPanel" class="sheet-panel flex max-h-[90vh] w-full flex-col overflow-hidden rounded-t-3xl bg-surface ring-1 ring-edge/10 sm:max-w-lg sm:rounded-3xl" role="dialog" aria-modal="true"></div>
  </div>
</div>

<!-- =============================== TOAST ============================== -->
<div id="toast" role="status" aria-live="polite"
  class="pointer-events-none fixed bottom-6 left-1/2 z-[80] -translate-x-1/2 translate-y-3 rounded-xl bg-zinc-900/95 px-4 py-2.5 text-sm font-medium text-white opacity-0 shadow-card ring-1 ring-white/10 transition-all duration-200"></div>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.js"></script>
<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/staff.js?v=20261018e"></script>
<!-- Table reservations -->
<script src="js/floorplan.js?v=20261018e"></script>
<script src="js/staff-reservations.js?v=20261018e"></script>
<script src="js/staff-hours.js?v=20261018e"></script>
<script src="js/staff-feedback.js?v=20261018e"></script>
<script src="js/staff-offers.js?v=20261018e"></script>
</body>
</html>
