# Sends due reservation reminders (push) and releases tables of guests who didn't come.
# Runs every 15 minutes; also keeps the database awake.
name: Reservation reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        run: |
          curl -s -X POST -H "Content-Type: application/json" -d '{"action":"reminders"}' \
            "https://zrmnxtcxibpwxssurelk.supabase.co/functions/v1/reservation-push"
      - name: Owner alerts for low ratings (backup)
        run: |
          curl -s -X POST -H "Content-Type: application/json" -d '{}' \
            "https://zrmnxtcxibpwxssurelk.supabase.co/functions/v1/feedback-alert"
